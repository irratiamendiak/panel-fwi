name: Actualizar FWI

on:
  schedule:
    # Todas las horas son UTC. El dato del FWI es el del mediodía solar, que son siempre las 12:00 UTC
    # (13:00 en invierno, 14:00 en verano). El día se cierra una hora después (14:00 en invierno,
    # 15:00 en verano). GitHub retrasa o se salta a veces los crons, y más a las horas en punto, así que
    # hay varios lanzamientos de envío: notificar.py solo envía si el dato está cerrado y si hoy no se
    # ha enviado ya, de modo que los de respaldo no duplican nada.
    - cron: "17 6 * * *"     # previsión de primera hora (08:17 en verano, 07:17 en invierno)
    - cron: "7 13 * * *"     # envío diario: 14:07 en invierno, 15:07 en verano (hora peninsular)
    - cron: "37 13 * * *"    # respaldo
    - cron: "7 14 * * *"     # respaldo
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions
    inputs:
      notificar:
        description: "Enviar también correo y Telegram (aunque ya se hayan enviado hoy)"
        type: boolean
        default: false

permissions:
  contents: write      # para guardar los datos nuevos en el repositorio

concurrency:
  group: fwi
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install pyjwt cryptography requests reportlab numpy pillow
          fc-list | grep -qi dejavu || sudo apt-get install -y -qq fonts-dejavu-core

      - name: Calcular el FWI y guardar los datos
        # Si al subir los datos resulta que otra ejecución ya ha subido los suyos, NO se mezclan ficheros
        # (eso daba conflictos): se toma la versión del repositorio, se recalcula encima y se vuelve a subir.
        env:
          EUSKALMET_KEY: ${{ secrets.EUSKALMET_KEY }}
          EUSKALMET_EMAIL: ${{ secrets.EUSKALMET_EMAIL }}
        run: |
          umask 077
          CLAVE="$RUNNER_TEMP/clave.pem"
          printf '%s\n' "$EUSKALMET_KEY" > "$CLAVE"
          trap 'rm -f "$CLAVE"' EXIT
          git config user.name "fwi-bot"
          git config user.email "fwi-bot@users.noreply.github.com"
          for intento in 1 2 3 4; do
            python actualizar_fwi.py --clave "$CLAVE"
            git add datos docs/data
            if git diff --staged --quiet; then echo "Sin cambios que guardar."; exit 0; fi
            git commit -q -m "Actualiza datos FWI $(date -u +%F)"
            if git push -q; then echo "Datos guardados (intento $intento)."; exit 0; fi
            echo "Otra ejecución ha guardado datos antes (intento $intento): se recalcula sobre la versión actual..."
            sleep $((intento * 10))
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "No se han podido guardar los datos tras 4 intentos."
          exit 1

      - name: Notificaciones (correo y Telegram)
        # En las ejecuciones programadas, notificar.py decide solo: no envía antes del cierre del dato
        # ni repite lo ya enviado hoy. En las manuales solo se envía si se marca la casilla (--forzar).
        # Sin continue-on-error: si falla, se ejecuta el aviso técnico del final.
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.notificar)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TELEGRAM_CHAT_TEC: ${{ secrets.TELEGRAM_CHAT_TEC }}
        run: python notificar.py ${{ github.event_name == 'workflow_dispatch' && '--forzar' || '' }}

      - name: Publicar PDF para descargar y revisar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Basugix-${{ github.run_id }}
          path: Basugix_*.pdf
          if-no-files-found: warn
          retention-days: 7

      - name: Guardar el registro de notificaciones
        # el registro evita repetir avisos; si otra ejecución ha guardado algo entretanto, se toma su versión
        # del repositorio y se le pone encima este registro (que es el más reciente).
        continue-on-error: true
        run: |
          git add datos/notificaciones.json 2>/dev/null || exit 0
          git diff --staged --quiet && exit 0
          cp datos/notificaciones.json "$RUNNER_TEMP/notif.json"
          for intento in 1 2 3 4; do
            git commit -q -m "Registro de notificaciones $(date -u +%F)" || true
            git push -q && exit 0
            sleep $((intento * 5))
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/notif.json" datos/notificaciones.json
            git add datos/notificaciones.json
          done
          exit 1

      - name: Aviso técnico si algo ha fallado
        if: failure() && github.event_name == 'schedule'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TELEGRAM_CHAT_TEC: ${{ secrets.TELEGRAM_CHAT_TEC }}
        run: python notificar.py --fallo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
