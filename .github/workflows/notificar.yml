name: Enviar boletín diario

on:
  schedule:
    # Comprobaciones en UTC. El mediodía solar termina a las 13:00 UTC
    # tanto en invierno (13:00 local + 1 h) como en verano (14:00 local + 1 h).
    # Reintentos cada 20 minutos para absorber retrasos de GitHub/Euskalmet.
    - cron: "2,22,42 13 * * *"
    - cron: "2,22,42 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fwi-notificaciones
  cancel-in-progress: false

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del PDF
        run: pip install reportlab numpy pillow

      - name: Enviar correo y Telegram cuando el dato esté cerrado
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TELEGRAM_CHAT_TEC: ${{ secrets.TELEGRAM_CHAT_TEC }}
        run: python notificar.py ${{ github.event_name == 'workflow_dispatch' && '--forzar' || '' }}

      - name: Guardar el registro de notificaciones
        run: |
          git config user.name "fwi-bot"
          git config user.email "fwi-bot@users.noreply.github.com"
          git add datos/notificaciones.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Registro de notificaciones $(date -u +%F)"
          for intento in 1 2 3 4; do
            git push && exit 0
            sleep $((intento * 5))
            git fetch origin main
            git reset --hard origin/main
            git add datos/notificaciones.json
            git diff --staged --quiet || git commit -m "Registro de notificaciones $(date -u +%F)"
          done
          exit 1

      - name: Aviso técnico si falla el envío
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TELEGRAM_CHAT_TEC: ${{ secrets.TELEGRAM_CHAT_TEC }}
        run: python notificar.py --fallo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
